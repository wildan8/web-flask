{% extends "base.html" %}

{% block title %}Camera{% endblock %}

{% block content %}
<div class="container text-center mt-5">
    <h2>Camera Capture</h2>
    <video id="video" width="700" height="394" autoplay playsinline class="border rounded"></video>
    <button id="start-cam" class="btn btn-secondary mt-2">Nyalakan Kamera</button>
    <button id="stop-cam" class="btn btn-danger mt-2" style="display:none;">Matikan Kamera</button>
    <canvas id="canvas" width="700" height="394" style="display:none;"></canvas>
    <div class="mt-3">
        <button id="capture" class="btn btn-primary">Capture Photo</button>
        <button id="send" class="btn btn-success" style="display:none;">Send to Server</button>
    </div>
    <input type="file" id="upload" accept="image/*" class="form-control mt-3" style="max-width:300px; margin:auto;">
    <div id="result" class="mt-3"></div>
    <img id="result-img" style="max-width:100%; margin-top:1em;"/>
</div>
<script>
const video = document.getElementById('video');
const startCamBtn = document.getElementById('start-cam');
const stopCamBtn = document.getElementById('stop-cam');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('capture');
const sendBtn = document.getElementById('send');
const uploadInput = document.getElementById('upload');
const resultDiv = document.getElementById('result');
const resultImg = document.getElementById('result-img');
let imageData = null;
let stream = null;

async function startCamera() {
    if (stream) return;
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        startCamBtn.style.display = 'none';
        stopCamBtn.style.display = 'inline-block';
    } catch (err) {
        alert('Could not access the camera: ' + err);
    }
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        stream = null;
        startCamBtn.style.display = 'inline-block';
        stopCamBtn.style.display = 'none';
    }
}

startCamBtn.onclick = startCamera;
stopCamBtn.onclick = stopCamera;

captureBtn.onclick = () => {
    // Buat offscreen canvas dengan resolusi tinggi
    const offscreenCanvas = document.createElement('canvas');
    offscreenCanvas.width = 1280;
    offscreenCanvas.height = 720;
    offscreenCanvas.getContext('2d').drawImage(video, 0, 0, 1280, 720);
    imageData = offscreenCanvas.toDataURL('image/png');
    // Tampilkan preview kecil di canvas utama
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.style.display = 'block';
    sendBtn.style.display = 'inline-block';
};

// Handler untuk upload file
uploadInput.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        imageData = evt.target.result;
        // Tampilkan preview kecil di canvas utama
        const img = new window.Image();
        img.onload = function() {
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.style.display = 'block';
            sendBtn.style.display = 'inline-block';
        };
        img.src = imageData;
    };
    reader.readAsDataURL(file);
};

sendBtn.onclick = async () => {
    resultDiv.innerHTML = 'Processing...';
    const response = await fetch('/process_image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageData })
    });
    const result = await response.json();
    resultDiv.innerHTML = 'Result: ' + result.result;
    resultImg.src = result.image;
};
</script>
{% endblock %}

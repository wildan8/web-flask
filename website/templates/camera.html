{% extends "base.html" %}
{% block title %}Camera{% endblock %}
{% block content %}
<div class="container text-center mt-5">
    <h2>Deteksi</h2>

    <!-- Main Buttons -->
    <div class="mb-4">
        <button id="open-camera-popup" class="btn btn-primary btn-lg mx-2" style="padding: 2rem 4rem; font-size: 1.8rem;">Camera</button>
        <button id="open-upload-popup" class="btn btn-secondary btn-lg mx-2" style="padding: 2rem 4rem; font-size: 1.8rem;">Upload</button>
    </div>

    <!-- Camera Modal -->
    <div class="modal fade" id="cameraModal" tabindex="-1" aria-labelledby="cameraModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cameraModalLabel">Camera</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="camera-select" class="form-label">Pilih Kamera:</label>
                        <select id="camera-select" class="form-select"></select>
                    </div>
                    <!-- Container untuk video dan canvas - tampil bergantian -->
                    <div class="text-center mb-3" style="width: 100%; max-width: 600px; margin: 0 auto; height: auto;">
                        <video id="video" width="700" height="394" autoplay playsinline class="img-fluid border rounded shadow-sm" style="display: block; width: 100%; height: auto;"></video>
                        <canvas id="canvas" width="700" height="394" class="img-fluid border rounded shadow-sm" style="display: none; width: 100%; height: auto;"></canvas>
                    </div>
                    <div class="d-grid gap-2 d-md-block text-center">
                        <button id="capture" class="btn btn-primary mt-3">Capture Photo</button>
                        <button id="send" class="btn btn-success mt-3" style="display:none;">Kirim ke Server</button>
                        <!-- Loading indicator for camera modal -->
                        <div id="camera-loading" class="d-flex align-items-center justify-content-center mt-3" style="display: none !important;">
                            <strong>Mengirim...</strong>
                            <div class="spinner-border ms-2" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadModalLabel">Unggah Gambar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="file" id="upload" accept="image/*" class="form-control mx-auto mb-3" style="max-width:300px;">
                    <canvas id="canvas-upload-preview" width="700" height="394" style="display: none;" class="img-fluid border rounded mx-auto d-block my-3"></canvas>
                    <div class="text-center">
                        <button id="send-upload" class="btn btn-success mt-3" style="display:none;">Kirim ke Server</button>
                        <!-- Loading indicator for upload modal -->
                        <div id="upload-loading" class="d-flex align-items-center justify-content-center mt-3" style="display: none !important;">
                            <strong>Mengirim...</strong>
                            <div class="spinner-border ms-2" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Loading Indicator (only shows when processing) -->
    <div id="loading-indicator" class="alert alert-info mt-4 d-flex align-items-center" role="alert" style="display: none !important;">
        <strong>Memproses gambar...</strong>
        <div class="spinner-border ms-2" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Result Display -->
     <div id= "result-component" class="d-flex border rounded shadow-sm mt-4 mx-auto" style="max-width: 1000px;">
        <div class="p-3" style="max-width: 50%;">
            <img id="result-img" class="img-fluid mt-3 border rounded shadow-sm" style="display: none; max-width: 480px; height: auto;" />
        </div>
        <div class="p-3">
            <div id="result" class="mt-4 alert alert-success" role="alert" style="display: none;"></div>
            <div id="result-detail" class="d-flex align-items-center">
                <span id="result-detail-text" class="mt-4 alert alert-success" role="alert" style="display: none;"></span>
            </div>
        </div>
     </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('capture');
const sendBtn = document.getElementById('send');
const uploadInput = document.getElementById('upload');
const resultDiv = document.getElementById('result');
const resultImg = document.getElementById('result-img');
const cameraSelect = document.getElementById('camera-select');
const openCameraPopupBtn = document.getElementById('open-camera-popup');
const openUploadPopupBtn = document.getElementById('open-upload-popup');
const canvasUploadPreview = document.getElementById('canvas-upload-preview');
const sendUploadBtn = document.getElementById('send-upload');
const loadingIndicator = document.getElementById('loading-indicator');
const cameraLoading = document.getElementById('camera-loading');
const uploadLoading = document.getElementById('upload-loading');

let imageData = null;
let stream = null;
let currentDeviceId = null;

// Reset functions
function resetCameraModal() {
    // Stop and clear video stream
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
    video.srcObject = null;
    
    // Clear canvas and ensure proper visibility
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas.style.display = 'none';
    video.style.display = 'block';
    
    // Reset buttons
    captureBtn.textContent = 'Capture Photo';
    sendBtn.style.display = 'none';
    
    // Hide loading
    cameraLoading.style.setProperty('display', 'none', 'important');
    
    // Clear image data
    imageData = null;
}

function resetUploadModal() {
    canvasUploadPreview.getContext('2d').clearRect(0, 0, canvasUploadPreview.width, canvasUploadPreview.height);
    canvasUploadPreview.style.display = 'none';
    sendUploadBtn.style.display = 'none';
    uploadInput.value = '';
    uploadLoading.style.setProperty('display', 'none', 'important');
    imageData = null;
}

function showMainLoading() {
    loadingIndicator.style.display = 'flex';
    resultDiv.style.display = 'none';
    resultImg.style.display = 'none';
}

function hideMainLoading() {
    console.log('hideMainLoading');
    loadingIndicator.style.setProperty('display', 'none', 'important');
    cameraLoading.style.setProperty('display', 'none', 'important');
    uploadLoading.style.setProperty('display', 'none', 'important');
}

function showResult(result) {
    if (result) {
        resultDiv.innerHTML = 'Hasil Deteksi: ' + result.result;
        resultDiv.classList.remove('alert-danger');
        resultDiv.classList.add('alert-success');
        resultImg.src = result.image;
        resultDiv.style.display = 'block';
        resultImg.style.display = 'block';
    }
}

function showError(message) {
    hideMainLoading();
    resultDiv.innerHTML = 'Error: ' + message;
    resultDiv.classList.remove('alert-success');
    resultDiv.classList.add('alert-danger');
    resultDiv.style.display = 'block';
    resultImg.style.display = 'none';
}

async function sendImageToServer(imageData, source = 'camera') {
    // Show appropriate loading indicator
    if (source === 'camera') {
        cameraLoading.style.display = 'flex';
    } else {
        uploadLoading.style.display = 'flex';
    }

    try {
        // Hide modal loading indicators
        // loadingIndicator.style.setProperty('display', 'none', 'important');
        cameraLoading.style.setProperty('display', 'none', 'important');
        uploadLoading.style.setProperty('display', 'none', 'important');
        
        // Show main loading immediately
        showMainLoading();
        
        const response = await fetch('/process_image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageData })
        });

        if (!response.ok) throw new Error('Gagal mengirim gambar');

        const result = await response.json();
        
        // Show loading for exactly 5 seconds, then show result
        setTimeout(() => {
            hideMainLoading();
            showResult(result);
        }, 5000);

    } catch (error) {
        console.error(error);
        // Hide modal loading indicators
        cameraLoading.style.setProperty('display', 'none', 'important');
        uploadLoading.style.setProperty('display', 'none', 'important');
        
        // Show loading for 5 seconds, then show error
        setTimeout(() => {
            showError(error.message);
        }, 5000);
    }
}

// Event listeners untuk reset saat modal tertutup
document.getElementById('cameraModal').addEventListener('hidden.bs.modal', () => {
    resetCameraModal();
});

document.getElementById('uploadModal').addEventListener('hidden.bs.modal', () => {
    resetUploadModal();
});

// List kamera
async function listCameras() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    cameraSelect.innerHTML = '';
    devices.forEach(device => {
        if (device.kind === 'videoinput') {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Kamera ${cameraSelect.length + 1}`;
            cameraSelect.appendChild(option);
        }
    });
}

// Mulai kamera
async function startCamera(deviceId = null) {
    // Stop existing stream first
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
    
    let constraints = { video: true };
    if (deviceId) {
        constraints.video = { deviceId: { exact: deviceId } };
    }
    
    try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        
        // Ensure only video is visible initially
        video.style.display = 'block';
        canvas.style.display = 'none';
        
        // Reset capture button jika sebelumnya sudah capture
        captureBtn.textContent = 'Capture Photo';
        sendBtn.style.display = 'none';
        
    } catch (err) {
        console.error('Camera error:', err);
        alert('Tidak dapat mengakses kamera: ' + err.message);
    }
}

// Capture foto - PERBAIKAN UTAMA
captureBtn.onclick = () => {
    if (captureBtn.textContent === 'Capture Photo') {
        // Pastikan video sudah ready
        if (video.videoWidth === 0 || video.videoHeight === 0) {
            alert('Video belum siap. Silakan tunggu sebentar.');
            return;
        }
        
        // Capture the photo untuk dikirim ke server (resolusi tinggi)
        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = 1920;
        offscreenCanvas.height = 1080;
        offscreenCanvas.getContext('2d').drawImage(video, 0, 0, 1920, 1080);
        imageData = offscreenCanvas.toDataURL('image/png');

        // Set canvas dimensions to match video's current display size
        const videoRect = video.getBoundingClientRect();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // Draw pada preview canvas
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Sembunyikan video, tampilkan canvas preview
        video.style.display = 'none';
        canvas.style.display = 'block';
        
        // Show send button dan ubah text capture button
        sendBtn.style.display = 'inline-block';
        captureBtn.textContent = 'Ambil Ulang';
        
        console.log('Captured with dimensions:', canvas.width, 'x', canvas.height);
        
    } else {
        // Reset - sembunyikan preview, tampilkan video
        canvas.style.display = 'none';
        video.style.display = 'block';
        
        // Hide send button dan reset capture button
        sendBtn.style.display = 'none';
        captureBtn.textContent = 'Capture Photo';
        
        // Clear canvas data
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        imageData = null;
    }
};

// Upload file handler
uploadInput.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(evt) {
        imageData = evt.target.result;
        const img = new window.Image();
        img.onload = function() {
            const ctx = canvasUploadPreview.getContext('2d');
            ctx.clearRect(0, 0, canvasUploadPreview.width, canvasUploadPreview.height);
            
            // Calculate aspect ratio for proper display
            const aspectRatio = img.width / img.height;
            let drawWidth = canvasUploadPreview.width;
            let drawHeight = drawWidth / aspectRatio;
            
            if (drawHeight > canvasUploadPreview.height) {
                drawHeight = canvasUploadPreview.height;
                drawWidth = drawHeight * aspectRatio;
            }
            
            const xOffset = (canvasUploadPreview.width - drawWidth) / 2;
            const yOffset = (canvasUploadPreview.height - drawHeight) / 2;
            
            ctx.drawImage(img, xOffset, yOffset, drawWidth, drawHeight);
            canvasUploadPreview.style.display = 'block';
            sendUploadBtn.style.display = 'inline-block';
        };
        img.src = imageData;
    };
    reader.readAsDataURL(file);
};

// Kirim ke server dari Camera Modal
sendBtn.onclick = async () => {
    if (!imageData) return;
    
    // Close modal first
    const modal = bootstrap.Modal.getInstance(document.getElementById('cameraModal'));
    modal.hide();
    
    // Send to server
    await sendImageToServer(imageData, 'camera');
};

// Kirim ke server dari Upload Modal
sendUploadBtn.onclick = async () => {
    if (!imageData) return;
    
    // Close modal first
    const modal = bootstrap.Modal.getInstance(document.getElementById('uploadModal'));
    modal.hide();
    
    // Send to server
    await sendImageToServer(imageData, 'upload');
};

// Tombol buka modal
openCameraPopupBtn.onclick = () => {
    const modal = new bootstrap.Modal(document.getElementById('cameraModal'));
    modal.show();
    
    // Initialize camera after modal is shown
    listCameras().then(() => {
        if (cameraSelect.options.length > 0) {
            currentDeviceId = cameraSelect.value;
            startCamera(currentDeviceId);
        }
    });
};

openUploadPopupBtn.onclick = () => {
    const modal = new bootstrap.Modal(document.getElementById('uploadModal'));
    modal.show();
};

// Camera selection change handler
cameraSelect.onchange = () => {
    currentDeviceId = cameraSelect.value;
    startCamera(currentDeviceId);
};

// Reset page state on load to ensure clean start
document.addEventListener('DOMContentLoaded', () => {
    resetCameraModal();
    resetUploadModal();
});
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Camera{% endblock %}

{% block content %}
<div class="container text-center mt-5">
    <h2>Camera Capture</h2>
    <div class="mb-2">
        <label for="camera-select">Camera:</label>
        <select id="camera-select" class="form-select" style="display:inline-block; width:auto;"></select>
        <button id="zoom-in" class="btn btn-outline-primary btn-sm mx-1">+</button>
        <button id="zoom-out" class="btn btn-outline-primary btn-sm">-</button>
        <span id="zoom-level" class="mx-2"></span>
        <!-- Brightness controls -->
        <button id="brightness-up" class="btn btn-outline-warning btn-sm mx-1">Brightness +</button>
        <button id="brightness-down" class="btn btn-outline-warning btn-sm">Brightness -</button>
        <span id="brightness-level" class="mx-2"></span>
    </div>
    <video id="video" width="700" height="394" autoplay playsinline class="border rounded"></video>
    <button id="start-cam" class="btn btn-secondary mt-2">Nyalakan Kamera</button>
    <button id="stop-cam" class="btn btn-danger mt-2" style="display:none;">Matikan Kamera</button>
    <canvas id="canvas" width="700" height="394" style="display:none;"></canvas>
    <div class="mt-3">
        <button id="capture" class="btn btn-primary">Capture Photo</button>
        <button id="send" class="btn btn-success" style="display:none;">Send to Server</button>
    </div>
    <input type="file" id="upload" accept="image/*" class="form-control mt-3" style="max-width:300px; margin:auto;">
    <div id="result" class="mt-3"></div>
    <img id="result-img" style="max-width:100%; margin-top:1em;"/>
</div>
<script>
const video = document.getElementById('video');
const startCamBtn = document.getElementById('start-cam');
const stopCamBtn = document.getElementById('stop-cam');
const canvas = document.getElementById('canvas');
const captureBtn = document.getElementById('capture');
const sendBtn = document.getElementById('send');
const uploadInput = document.getElementById('upload');
const resultDiv = document.getElementById('result');
const resultImg = document.getElementById('result-img');
const cameraSelect = document.getElementById('camera-select');
const zoomInBtn = document.getElementById('zoom-in');
const zoomOutBtn = document.getElementById('zoom-out');
const zoomLevelSpan = document.getElementById('zoom-level');
// Brightness controls
const brightnessUpBtn = document.getElementById('brightness-up');
const brightnessDownBtn = document.getElementById('brightness-down');
const brightnessLevelSpan = document.getElementById('brightness-level');
let imageData = null;
let stream = null;
let currentDeviceId = null;
let currentZoom = 1;
let maxZoom = 3;
let minZoom = 1;
let zoomStep = 0.1;
let videoTrack = null;
let currentBrightness = 1;
let minBrightness = 0;
let maxBrightness = 2;
let brightnessStep = 1;

// List cameras
async function listCameras() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    cameraSelect.innerHTML = '';
    devices.forEach(device => {
        if (device.kind === 'videoinput') {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Camera ${cameraSelect.length + 1}`;
            cameraSelect.appendChild(option);
        }
    });
}

// Start camera with selected device
async function startCamera(deviceId = null) {
    if (stream) stopCamera();
    let constraints = {
        video: {
            width: { ideal: 640 },
            height: { ideal: 480 }
        }
    };
    if (deviceId) {
        constraints.video.deviceId = { exact: deviceId };
    }
    try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        startCamBtn.style.display = 'none';
        stopCamBtn.style.display = 'inline-block';
        // Setup zoom and brightness controls
        setupZoom();
        setupBrightness();
    } catch (err) {
        alert('Could not access the camera: ' + err);
    }
}

// Stop camera
function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        stream = null;
        videoTrack = null;
        startCamBtn.style.display = 'inline-block';
        stopCamBtn.style.display = 'none';
        zoomLevelSpan.textContent = '';
        brightnessLevelSpan.textContent = '';
    }
}

// Setup zoom controls
function setupZoom() {
    console.log("MASUK FUGNSI ZOOM")
    if (!videoTrack) return;
    const capabilities = videoTrack.getCapabilities();
    console.log("capabilities",capabilities)
    if ('zoom' in capabilities) {
        minZoom = capabilities.zoom.min;
        maxZoom = capabilities.zoom.max;
        currentZoom = videoTrack.getSettings().zoom || minZoom;
        zoomLevelSpan.textContent = `Zoom: ${currentZoom.toFixed(1)}x`;
        zoomInBtn.disabled = false;
        zoomOutBtn.disabled = false;
    } else {
        zoomLevelSpan.textContent = 'Zoom not supported';
        zoomInBtn.disabled = true;
        zoomOutBtn.disabled = true;
    }
}

// Change zoom
function changeZoom(delta) {
    if (!videoTrack) return;
    let newZoom = Math.min(maxZoom, Math.max(minZoom, currentZoom + delta));
    videoTrack.applyConstraints({ advanced: [{ zoom: newZoom }] }).then(() => {
        currentZoom = newZoom;
        zoomLevelSpan.textContent = `Zoom: ${currentZoom.toFixed(1)}x`;
    });
}

// Setup brightness controls
function setupBrightness() {
    if (!videoTrack) return;
    const capabilities = videoTrack.getCapabilities();
    if ('brightness' in capabilities) {
        minBrightness = capabilities.brightness.min;
        maxBrightness = capabilities.brightness.max;
        currentBrightness = videoTrack.getSettings().brightness || minBrightness;
        brightnessLevelSpan.textContent = `Brightness: ${currentBrightness.toFixed(1)}`;
        brightnessUpBtn.disabled = false;
        brightnessDownBtn.disabled = false;
    } else {
        brightnessLevelSpan.textContent = 'Brightness not supported';
        brightnessUpBtn.disabled = true;
        brightnessDownBtn.disabled = true;
    }
}

function changeBrightness(delta) {
    if (!videoTrack) return;
    let newBrightness = Math.min(maxBrightness, Math.max(minBrightness, currentBrightness + delta));
    videoTrack.applyConstraints({ advanced: [{ brightness: newBrightness }] }).then(() => {
        currentBrightness = newBrightness;
        brightnessLevelSpan.textContent = `Brightness: ${currentBrightness.toFixed(1)}`;
    });
}

// Event listeners
startCamBtn.onclick = () => startCamera(currentDeviceId);
stopCamBtn.onclick = stopCamera;
cameraSelect.onchange = () => {
    currentDeviceId = cameraSelect.value;
    startCamera(currentDeviceId);
};
zoomInBtn.onclick = () => changeZoom(zoomStep);
zoomOutBtn.onclick = () => changeZoom(-zoomStep);
brightnessUpBtn.onclick = () => changeBrightness(brightnessStep);
brightnessDownBtn.onclick = () => changeBrightness(-brightnessStep);

// On page load
listCameras().then(() => {
    if (cameraSelect.options.length > 0) {
        currentDeviceId = cameraSelect.value;
    }
});

captureBtn.onclick = () => {
    // Buat offscreen canvas dengan resolusi tinggi
    const offscreenCanvas = document.createElement('canvas');
    offscreenCanvas.width = 1280;
    offscreenCanvas.height = 720;
    offscreenCanvas.getContext('2d').drawImage(video, 0, 0, 1280, 720);
    imageData = offscreenCanvas.toDataURL('image/png');
    // Tampilkan preview kecil di canvas utama
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    // Atur brightness awal
    adjustCanvasBrightness(canvas, currentBrightness);
    canvas.style.display = 'block';
    sendBtn.style.display = 'inline-block';
    // Tampilkan slider brightness
    let canvasBrightness = 1;
    const canvasBrightnessSlider = document.createElement('input');
    canvasBrightnessSlider.type = 'range';
    canvasBrightnessSlider.min = '0.5';
    canvasBrightnessSlider.max = '2';
    canvasBrightnessSlider.step = '0.05';
    canvasBrightnessSlider.value = '1';
    canvasBrightnessSlider.style.display = 'block';
    canvasBrightnessSlider.className = 'form-range mt-2';
    canvas.parentNode.insertBefore(canvasBrightnessSlider, canvas.nextSibling);
    const canvasBrightnessLabel = document.createElement('span');
    canvasBrightnessLabel.textContent = 'Brightness: 1.0';
    canvasBrightnessLabel.style.display = 'inline-block';
    canvas.parentNode.insertBefore(canvasBrightnessLabel, canvasBrightnessSlider.nextSibling);

    canvasBrightnessSlider.oninput = function() {
        canvasBrightness = parseFloat(this.value);
        canvasBrightnessLabel.textContent = `Brightness: ${canvasBrightness.toFixed(2)}`;
        // Redraw image with new brightness
        const img = new window.Image();
        img.onload = function() {
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            adjustCanvasBrightness(canvas, canvasBrightness);
        };
        img.src = imageData;
    };
};

// Handler untuk upload file
uploadInput.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
        imageData = evt.target.result;
        // Tampilkan preview kecil di canvas utama
        const img = new window.Image();
        img.onload = function() {
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            // Atur brightness awal
            adjustCanvasBrightness(canvas, currentBrightness);
            canvas.style.display = 'block';
            sendBtn.style.display = 'inline-block';
            // Tampilkan slider brightness
            let canvasBrightness = 1;
            const canvasBrightnessSlider = document.createElement('input');
            canvasBrightnessSlider.type = 'range';
            canvasBrightnessSlider.min = '0.5';
            canvasBrightnessSlider.max = '2';
            canvasBrightnessSlider.step = '0.05';
            canvasBrightnessSlider.value = '1';
            canvasBrightnessSlider.style.display = 'block';
            canvasBrightnessSlider.className = 'form-range mt-2';
            canvas.parentNode.insertBefore(canvasBrightnessSlider, canvas.nextSibling);
            const canvasBrightnessLabel = document.createElement('span');
            canvasBrightnessLabel.textContent = 'Brightness: 1.0';
            canvasBrightnessLabel.style.display = 'inline-block';
            canvas.parentNode.insertBefore(canvasBrightnessLabel, canvasBrightnessSlider.nextSibling);

            canvasBrightnessSlider.oninput = function() {
                canvasBrightness = parseFloat(this.value);
                canvasBrightnessLabel.textContent = `Brightness: ${canvasBrightness.toFixed(2)}`;
                // Redraw image with new brightness
                const img = new window.Image();
                img.onload = function() {
                    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    adjustCanvasBrightness(canvas, canvasBrightness);
                };
                img.src = imageData;
            };
        };
        img.src = imageData;
    };
    reader.readAsDataURL(file);
};

sendBtn.onclick = async () => {
    resultDiv.innerHTML = 'Processing...';
    const response = await fetch('/process_image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageData })
    });
    const result = await response.json();
    resultDiv.innerHTML = 'Result: ' + result.result;
    resultImg.src = result.image;
};

// Fungsi untuk mengatur brightness pada canvas setelah capture
function adjustCanvasBrightness(canvas, value) {
    const ctx = canvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
        data[i] = Math.min(255, data[i] * value);     // Red
        data[i+1] = Math.min(255, data[i+1] * value); // Green
        data[i+2] = Math.min(255, data[i+2] * value); // Blue
    }
    ctx.putImageData(imageData, 0, 0);
}
</script>
{% endblock %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">

    <!-- Optional Custom CSS -->
    <style>
        .nav-link.active {
            font-weight: bold;
            color: #0d6efd !important;
        }
    </style>

    <title>{% block title %}Home{% endblock %}</title>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg{% if navbar_overlay %} navbar-dark text-white bg-transparent position-absolute w-100 z-3{% else %} navbar-light bg-light shadow-sm{% endif %}">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item me-4"><a class="nav-link active" aria-current="page" href="/">Home</a></li>
                    <li class="nav-item me-4"><a class="nav-link" href="/camera">Deteksi</a></li>
                    <li class="nav-item me-4"><a class="nav-link" href="/riwayat">Riwayat</a></li>
                    <li class="nav-item me-4"><a class="nav-link" href="/tentang">Tentang Aplikasi</a></li>
                    {% if current_user.is_authenticated %}
                        <span class="navbar-text me-3">
                        👋 Halo, {{ current_user.full_name }}
                        </span>
                        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger">Logout</a>
                    {% else %}
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary me-2">Login</a>
                        <a href="{{ url_for('auth.register') }}" class="btn btn-primary">Register</a>
                    {% endif %}
                    <!-- {% if session.get('user_id') %}
                        <li class="nav-item"><a class="nav-link" href="/auth/logout">Logout ({{ session.get('username') }})</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/auth/login">Login</a></li>
                        <li class="nav-item"><a class="nav-link" href="/auth/register">Register</a></li>
                    {% endif %} -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- <div class="container"> -->
        {% block content %}
        {% endblock %}
    <!-- </div> -->

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
    
    <!-- Custom JS -->
    <script type="text/javascript" src="{{ url_for('static', filename='index.js') }}"></script>
</body>

</html>
